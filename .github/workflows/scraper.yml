name: Sony Price Comparison Scraper

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 10:00 AM Dubai time (UTC+4)
  workflow_dispatch:      # Allow manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Force Node.js 24
        shell: bash
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml gspread google-auth

      - name: Run scraper
        env:
          ZENROWS_API_KEY:        ${{ secrets.ZENROWS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GSHEET_ID:              ${{ secrets.GSHEET_ID }}
        run: python scraper.py
